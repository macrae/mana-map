name: tests

# The non-browser suite on every push and pull request. Deliberately NOT the
# browser suite: it needs a chromium download, takes four minutes, and asserts
# on real rendering under contention — which is how its five historical flakes
# were all born. It stays a local pre-push gate (`make test-browser`), and the
# PR template asks whether you ran it.
#
# There is no cache flag here and none is needed. The regenerate-and-compare
# cache lives in `.pytest_cache/`, which is gitignored, so a fresh checkout has
# an empty one and CI runs every test for real by construction.

on:
  push:
    branches: [main]
  pull_request:
  # The corpus job below is weekly. Everything else is per-push.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # FETCH THE WHOLE HISTORY. `actions/checkout` defaults to a DEPTH-1
      # shallow clone, and half this repo's artifacts are derived from a git
      # walk: `deck_versions.versions()` runs `git log --follow --
      # decklist.txt`, which in a shallow clone returns NOTHING. Every version
      # list comes back empty, `paper_state` falls to its `unresolved` branch,
      # and `build-index` writes a manifest saying three sleeved decks cannot
      # be resolved — so `data/decks/index.json` can never rebuild identically
      # and the byte-diff gate below cannot pass.
      #
      # It went unseen because the `Test` step fails first and short-circuits
      # the gate, so the one check that would have caught it never ran.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # Same ordering as `make setup`, and for the same reason: pacmap pulls
        # numba, and letting pip resolve it here triggers a source build of LLVM.
        run: |
          python -m pip install --upgrade pip
          pip install llvmlite==0.41.1 numba==0.58.1
          pip install -e ".[dev]"

      - name: Cache the sentence-transformer used by the strategy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-minilm

      - name: Build the strategy DB
        # WITHOUT THIS, CI DOES NOT RUN THE CITATION CONTRACT — and that test's
        # own docstring calls it "the load-bearing promise of this whole
        # project … an unrun validator here is worse than an unrun validator
        # anywhere else". It gates on `data/strategy/strategy_index.json`, which
        # is gitignored, so on a fresh checkout it skipped: all 60 stacks and 18
        # decisions, plus the `tutor_guide.json` and `diagnosis.json`
        # validators. `strategy.md` IS tracked and the built index is 69 KB, so
        # the only cost is a cached model download.
        run: manamap pilot build-strategy-db

      - name: Test
        # `make test`, NOT a bare pytest — CI must exercise the entry point
        # CONTRIBUTING tells people to use, or the Makefile is the one thing
        # nothing checks. It was, and `make manuals` broke on the first run
        # because it assumed a `.venv` that CI never creates.
        #
        # The fast suite. Most data-gated tests still run — the artifacts they
        # need are tracked on purpose. `-n auto` is already the default in
        # pyproject.
        #
        # `-rs` PRINTS THE SKIP REASONS, because "CI is green" used to mean
        # "everything ran" and it did not: the corpus (`data/cards.csv`,
        # `data/embeddings.npy`) is gitignored and needs a 600 MB Scryfall
        # download, so the tests that need it still cannot run here. What CI
        # cannot check, it must at least NAME — see the scheduled job below.
        run: make test PYTEST_ARGS=-rs

      - name: The manuals and version lists must still rebuild byte-identically
        # Cheap (9 s) and it is the project's central determinism claim, so it
        # is worth asserting outside the suite that also asserts it.
        #
        # `data/decks/` IN FULL, not just `index.json`. `make manuals` now also
        # regenerates every `versions.json` — a git walk, tracked since
        # 2026-09-02 — and a gate that rebuilds a file without comparing it is a
        # gate that cannot fail. Satisfiable only because a commit never carries
        # both a decklist and its version list, which
        # `tests/test_pilot_commit_protocol.py` enforces directly.
        run: |
          make manuals
          git diff --exit-code -- manuals/ data/decks/

  # ── THE GATES A PER-PUSH RUN CANNOT REACH ────────────────────────────────
  #
  # `data/cards.csv` and the embeddings are gitignored and come from a 600 MB
  # Scryfall download, so the validators that need the corpus —
  # `build_plan.json`, `deck_recon.json`, and the `bracket_report.json` /
  # `info.json` freshness gates — skip on every push. They were running NOWHERE.
  #
  # Weekly is the honest compromise: not on the critical path, but somewhere.
  # It does NOT run the models (no train, no embed) — `extract` alone writes
  # `cards.csv`, which is what those gates actually need.
  corpus-gates:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Full history, same reason as the `test` job above.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install llvmlite==0.41.1 numba==0.58.1
          pip install -e ".[dev]"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-minilm
      - name: Build the strategy DB
        run: manamap pilot build-strategy-db
      - name: Download and extract the corpus
        # Steps 1-2 only. The bulk file is large; `extract` writes cards.csv.
        run: |
          manamap download
          manamap extract
      - name: Every gate, including the ones a push cannot reach
        run: make test PYTEST_ARGS=-rs
