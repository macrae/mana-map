<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Always revalidate the HTML; its versioned assets may cache forever. See the
     matching note in index.html — a cached page pins the script ?v=, which pins
     DATA_VERSION, which pins every data fetch, and the deck silently goes stale. -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Deck Dossier — Mana Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;800&family=Michroma&family=Oswald:wght@500;700&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css?v=169">
</head><body>
<div class="trim">
  <div class="dossier-head">
    <div>
      <div class="slug-line">Mana Map · Deck Dossier</div>
      <h1 id="deckName">Loading…</h1>
      <div class="slug-line" id="commanderLine"></div>
    </div>
    <div class="head-links">
      <a id="manualLink" href="#">Pilot's Manual →</a>
      <a id="lensLink" href="index.html">See it on the map →</a>
      <a href="workbench.html">All decks →</a>
    </div>
  </div>
  <div id="deckPicker" class="slug-line" style="margin-bottom:20px"></div>
  <div id="panels" class="panels"></div>
  <div id="status" class="status">Fetching artifacts…</div>
</div>
<!-- session.js before shell.js: the strip reads the library through
     Session, and the drawer WRITES to it — a count can come from
     localStorage, taking a card back out cannot. ~10 KB, no data. -->
<!-- api.js: the dossier can RUN the deterministic measurements when a local
     server is there. Absent on the deployed site, where the page renders its
     static half and names the command instead. -->
<script src="js/api.js?v=169"></script>
<script src="js/session.js?v=169"></script>
<script src="js/shell.js?v=169"></script>
<script src="js/deck-view.js?v=169"></script>
</body></html>
