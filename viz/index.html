<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- The HTML must always revalidate; everything it references is versioned and may
     cache forever. Nothing busts this file, so a cached copy pins the ?v= on every
     script tag, which pins DATA_VERSION, which pins the ?v= on every data fetch. A
     ten-card decklist change once kept rendering the OLD 99 in Build through that
     chain — cut cards still drawing, a sideboard count that no longer existed — and
     a hard reload did not clear it. Only asking the page for its DATA_VERSION showed
     why. Three layers of correct cache-busting, defeated by the one file with none. -->
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Mana Map</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<link rel="stylesheet" href="css/mana-map.css?v=272">
</head>
<body>

<!-- The toolbar is MODE-AWARE. It used to show the same 17 controls in every
     mode, so Discover — a graph of one card — carried nine type filters, a
     density toggle and "Color by". `data-modes` names where a group belongs;
     `mana-map.js` shows and hides on `setMode`. Nothing was deleted: every
     control now appears where it does something.

     The wordmark is gone from here too. The shell strip above already carries
     it, and two wordmarks stacked is one of them being ignored. -->
<div class="toolbar">
  <!-- Mode is the primary navigation of this surface and was a <select>. Three
       tabs, because three choices in a dropdown is a menu hiding a switch. -->
  <div class="mode-tabs" id="modeTabs" role="tablist" aria-label="Mode">
    <button class="mode-tab" data-mode="discover" role="tab">Discover</button>
    <button class="mode-tab" data-mode="explore" role="tab">Explore</button>
    <button class="mode-tab" data-mode="build" role="tab">Build</button>
  </div>
  <!-- Kept, hidden, and still the thing every listener binds to: `setMode`
       writes it, tests read it, and `?mode=` applies through it. Rewiring all
       of that to the tabs would be a second source of truth for which mode is
       current, which is the bug this repo keeps undoing. -->
  <select id="modeSelect" hidden aria-hidden="true">
    <option value="discover">Discover</option>
    <option value="explore">Explore</option>
    <option value="build">Build</option>
  </select>
  <!-- No Map or Similarity picker (2026-10-10): the pages use ONE embedding,
       CardBERT, by the pilot's choice — the map, the neighbours and every relation
       answer out of it. The comparison with the function space is spaces.html. -->
  <div data-modes="explore build">
    <label for="colorBy">Color by</label>
    <select id="colorBy">
      <!-- Explore's default since 2026-10-28 (the pilot's review: "a lens, not a
           museum"): the cards in your SLEEVED decks lit, one colour per deck,
           the corpus dimmed to texture. `?color=` names another. Explore-only —
           `MODE_GROUPINGS` hides it in Build and Discover. -->
      <option value="decks">My decks</option>
      <option value="supertype">Supertype</option>
      <option value="role">Role</option>
      <option value="color">Primary Color</option>
      <option value="rarity">Rarity</option>
    </select>
  </div>
  <!-- The results list is absolutely positioned inside this wrapper, so it hangs
       under the input instead of stretching the toolbar row. -->
  <div id="searchWrap">
    <label for="search">Search</label>
    <input id="search" type="text" placeholder="Card name..." autocomplete="off">
    <div id="searchResults" class="search-results" hidden></div>
  </div>
  <!-- THE SET LENS: "show me the new set" in one click. `mana-map.js` derives the
       newest set from `sets.json` + `viz_index.json` (never a literal) and fills
       the label; it stays hidden until it has one. It IS the set filter below,
       set to that code — picking any other set is the Filters popover. -->
  <button class="toggle-btn set-lens" id="setLens" type="button" data-modes="explore" hidden></button>
  <!-- FILTERS, behind one button (2026-10-28). The set, the first-printed range and
       the nine type pills were all in view all the time; now they sit in a popover
       and the button counts what is active. The controls keep their ids, so every
       reader and writer of them (`applyPrintFocus`, `MM.setPrintFocus`, the
       type toggles) is unchanged. -->
  <div class="filters-wrap" id="filtersWrap" data-modes="explore build">
    <button class="toggle-btn filters-btn" id="filtersBtn" type="button"
            aria-expanded="false" aria-controls="filtersPop">Filters<span class="filters-count" id="filtersCount" hidden></span></button>
    <div class="bt-settings filters-pop" id="filtersPop" hidden>
      <!-- The printing HIGHLIGHT. Explore only: it dims the atlas around a set or a
           first-printed range, and only the atlas has a corpus to dim against. A set
           is the CORPUS printing's set, so it includes that set's reprints; the
           dates are when a card FIRST existed, which for a reprint is a different
           year. Both are said where they are chosen. -->
      <div class="print-filter" id="printFilter" data-modes="explore">
        <div class="deck-section-title">Set</div>
        <div class="filters-row">
          <select id="setSelect" aria-label="Set" title="Cards whose corpus printing is this set — so it includes the set's reprints">
            <option value="">any set</option>
          </select>
          <button class="toggle-btn" id="printClear" type="button" hidden title="Clear the set and date highlight (Esc)">×</button>
        </div>
        <div class="deck-section-title" title="When the card FIRST existed, across every printing — not when this printing came out">First printed</div>
        <div class="filters-row">
          <input id="firstAfter" type="date" aria-label="First printed on or after" title="on or after">
          <span class="print-to">to</span>
          <input id="firstBefore" type="date" aria-label="First printed on or before" title="on or before">
        </div>
      </div>
      <div class="deck-section-title">Types</div>
      <div class="toggles" id="toggles"></div>
    </div>
  </div>
  <div class="topo-toggles" data-modes="explore">
    <button class="toggle-btn" id="drillFiltered" onclick="Drill.enterFiltered()"
            title="Re-map the currently filtered cards from their 128-dim embeddings">Drill ⤓</button>
  </div>
</div>

<div class="main-area">
  <!-- The map column: the canvas, and under it Build's candidate review grid when one
       is open. A COLUMN rather than an overlay, because the graph's canvas sits at
       z-index 10 and swallowed every click on a drawer laid over it (2026-10-07). -->
  <div class="plot-col" id="plotCol">
  <div id="plot">
    <div id="drillBar" class="drill-bar" style="display:none"></div>
    <!-- Fit and Reheat act on the CANVAS, so they live on the canvas. They spent
         their life at the foot of the right-hand panel, below the scoreboard, the
         truncation notice and two disclosure blocks — controls for the thing you
         are looking at, placed where you have to scroll away from it to reach
         them. Top-RIGHT because `.drill-bar` owns the top-left and both can be on
         screen at once. `force.js` fills it; `#plot:not(.force-mode)` hides it,
         exactly as it hides `.force-canvas`, so leaving the mode takes the bar
         with the graph and nothing has to remember to. -->
    <!-- One top-right row of canvas controls: Build's settings (View, Show — the
         popover, P1 2026-10-28) beside the graph's Fit / Reheat. `#buildBar` is its
         own element because the graph bar hides with the graph, and the map view
         still needs the way back to it; `build.js` fills it in Build only. -->
    <div class="canvas-tools">
      <!-- Explore's settings (2026-10-28): Topo, Labels and Motion act on the
           PICTURE, so they live on it, in a gear popover — the pattern and the CSS
           of Build's settings beside it. They held a front-row seat in the toolbar
           they did not earn. Static markup: the buttons keep their ids and their
           listeners; `mana-map.js` only opens, closes and hides the bar by mode. -->
      <div id="exploreBar" class="build-bar explore-bar" hidden>
        <button class="graph-btn bt-settings-btn" id="exploreSettingsBtn" type="button"
                aria-expanded="false" aria-controls="exploreSettings"
                title="Map settings: contours, labels, motion">⚙ Map</button>
        <div class="bt-settings" id="exploreSettings" hidden>
          <div class="deck-section-title">Show</div>
          <div class="explore-settings-row">
            <button class="toggle-btn" id="toggleContours" type="button" title="Density contours">Topo</button>
            <button class="toggle-btn active" id="toggleLabels" type="button" title="Region labels">Labels</button>
            <button class="toggle-btn active" id="toggleMotion" type="button"
                    title="Ambient drift — the atlas turns slowly at altitude, and settles as you zoom in">Motion</button>
          </div>
          <div class="lens-note">Topo: density contours · Labels: region names, with what each region is for under them · Motion: the drift at altitude</div>
        </div>
      </div>
      <div id="buildBar" class="build-bar" hidden></div>
      <div id="graphBar" class="graph-bar" hidden></div>
    </div>
  </div>
  </div>
  <div class="detail-panel" id="detailPanel">
    <div class="detail-inner" id="detailInner"></div>
  </div>
  <div class="deck-panel" id="deckPanel">
    <div class="deck-inner" id="deckInner"></div>
  </div>
</div>

<div class="status" id="status">Loading...</div>

<!-- The shell first and dependency-free: it is the one thing that must paint
     even if the atlas never loads. -->
<!-- Probes for a local `manamap serve`. Dependency-free and early, because
     every agent affordance is gated on the answer. -->
<script src="js/api.js?v=272"></script>
<script src="js/page-state.js?v=272"></script>
<script src="js/shell.js?v=272"></script>
<script src="js/stage.js?v=272"></script>
<script src="js/session.js?v=272"></script>
<script src="js/decklist.js?v=272"></script>
<script src="js/discovery.js?v=272"></script>
<script src="js/render/canvas.js?v=272"></script>
<script src="js/mana-map.js?v=272"></script>
<script src="js/drill.js?v=272"></script>
<script src="js/force.js?v=272"></script>
<script src="js/build.js?v=272"></script>
<!-- Build's edit tray: edit a bench deck in place, or start a branch on a sleeved one. -->
<script src="js/deck-edit.js?v=272"></script>
</body>
</html>
