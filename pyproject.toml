[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manamap"
version = "0.1.0"
description = "MTG card embedding pipeline and interactive map visualization"
# 3.10 EXACTLY, and the upper bound is not caution. PyTorch publishes no wheels
# for 3.13+, and `sentence-transformers<4` / `numpy<2` are pinned against torch
# 2.2.2. This said `>=3.10` for a long time while the README carried a paragraph
# explaining that the manifest was lying — which helps nobody on 3.12, who gets
# an unresolvable dependency graph and no hint why. Say it here, where pip reads.
requires-python = ">=3.10,<3.11"
dependencies = [
    "requests",
    "pandas",
    "torch",
    "sentence-transformers<4",
    "numpy<2",
    "pacmap",
    "hdbscan>=0.8.33",
    # The terminal is a first-class surface here (`manamap/console.py`), so its
    # renderer is a real dependency. It was PRESENT in the environment for
    # months without being declared, because `typer` — itself transitive —
    # happens to require it. A transitive dependency is not an available one:
    # the day something drops typer, every progress bar in the bench stops
    # importing. `console.py` still degrades to plain lines if it is missing,
    # which is a safety net rather than a licence to leave it undeclared.
    "rich>=13",
]

[project.optional-dependencies]
# playwright drives the behavioural viz tests (tests/test_viz_behaviour.py). It needs a
# one-time browser download: `.venv/bin/python -m playwright install chromium`. Those
# tests skip cleanly without it, so the suite still runs on a fresh clone.
#
# pytest-xdist is now ON by default (see addopts). It was held back on the grounds
# that "the browser suite has never been exercised under parallelism" — true when
# written, and since falsified by the repo's own record: `-n 4` runs the browser
# suite in 232 s against ~600 s serial, and the five flakes that exposed were every
# one a fixed `wait_for_timeout` measuring the machine rather than the behaviour.
# They are fixed and one test is quarantined as `serial_only`. Nothing else was
# needed: `viz_server` already picks a free port per session and `browser` is
# session-scoped, so each xdist worker gets its own of both.
dev = ["pytest", "pytest-xdist", "playwright"]

[project.scripts]
manamap = "manamap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A bare `pytest` is the INNER LOOP: the non-browser suite, parallel. It used to
# be all 1,624 cases including the browser suite — about ten minutes — because the
# "browser is excluded by default" rule lived in the comment below and in no
# config anyone ran. A default nobody can afford is a default nobody uses.
#
#   pytest                          the inner loop
#   pytest -n0                      same, one process (faster for a single -k;
#                                   worker startup outweighs the split there)
#   pytest -m browser -n 4          the viz suite
#   pytest -m ""                    literally everything, the old default
#   pytest --no-test-cache          nothing served from the cache (see conftest)
addopts = "-q -m 'not browser and not forge and not fleet' -n auto"
markers = [
    # Browser tests. They boot a real Chromium against a real server and assert on what
    # rendered — the only tests here that can catch a viz regression. Excluded from the
    # default run because they are ~100x slower than the rest; run them with
    # `pytest -m browser`, or the fast suite with `pytest -m "not browser"`.
    "browser: drives a real browser via playwright (slow; needs `playwright install chromium`)",
    # A wall-clock budget measures the machine, so it cannot share one with three other
    # Chromiums: under `-n 4` the canvas render budget read 41 ms against a 30 ms limit
    # while the renderer was unchanged. Run these on their own with
    # `pytest -m "browser and serial_only"`.
    "serial_only: asserts a wall-clock budget; meaningless under -n (run serially)",
    # A real Forge game: ~6 s for two seats, needs the engine installed outside the
    # repo (docs/simulation.md). Opt in with `pytest -m forge`; the harness's own
    # logic is tested without it.
    "forge: runs the Forge engine headless (slow; needs ~/.mana-map/forge)",
    # Calibration: re-derives a constant by measuring EVERY tracked deck, which is
    # ~13 goldfish runs per test. That is the only way a threshold can be held to
    # the evidence it came from, and far too slow for the inner loop. Run with
    # `pytest -m fleet`.
    "fleet: re-derives a calibrated constant across every tracked deck (slow)",
]
