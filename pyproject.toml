[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manamap"
version = "0.1.0"
description = "MTG card embedding pipeline and interactive map visualization"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pandas",
    "torch",
    "sentence-transformers<4",
    "numpy<2",
    "pacmap",
    "hdbscan>=0.8.33",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
manamap = "manamap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
